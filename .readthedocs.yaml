# Read the Docs builds the same site `make docs` does, from the same pinned requirements.
#
# `fail_on_warning` matches the `-W` the Makefile and the Documentation workflow use, so a
# cross-reference that breaks cannot reach the published site through this path either.
version: 2

build:
    os: ubuntu-24.04
    tools:
        python: '3.13'

sphinx:
    configuration: docs/conf.py
    fail_on_warning: true

python:
    install:
        - requirements: docs/requirements.txt

formats:
    - htmlzip
