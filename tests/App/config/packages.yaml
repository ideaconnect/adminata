# Framework, Twig, security and Doctrine for the demo application (PLAN/08 §2).

parameters:
    # adminata supports MySQL, MariaDB and Percona; there is no SQLite support (owner directive 9).
    # `docker compose up -d` starts a matching MySQL; override the variable for another server.
    env(ADMINATA_DEMO_DATABASE_URL): 'mysql://root:adminata@127.0.0.1:7010/adminata_demo?serverVersion=8.4.0&charset=utf8mb4'

framework:
    secret: adminata-demo
    http_method_override: false
    assets:
        enabled: true
    form:
        enabled: true
    csrf_protection:
        enabled: true
    translator:
        enabled: true
        default_path: '%kernel.project_dir%/translations'
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
    router:
        utf8: true

twig:
    default_path: '%kernel.project_dir%/templates'
    strict_variables: true
    form_themes:
        - '@SonataAdmin/Form/form_admin_fields.html.twig'

doctrine:
    dbal:
        url: '%env(resolve:ADMINATA_DEMO_DATABASE_URL)%'
    orm:
        auto_mapping: false
        validate_xml_mapping: true
        mappings:
            AdminataDemo:
                type: attribute
                dir: '%kernel.project_dir%/Entity'
                is_bundle: false
                prefix: Adminata\Tests\App\Entity

security:
    # In-memory users: the demo has no user entity and adminata ships no SonataUserBundle
    # (owner directive 6). `sonata_admin.security.handler` stays at its `noop` default, so the
    # firewall is what decides who gets in.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_SONATA_ADMIN]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser: plaintext
    providers:
        demo:
            memory:
                users:
                    admin:
                        password: admin
                        roles: ['ROLE_SUPER_ADMIN']
                    editor:
                        password: editor
                        roles: ['ROLE_ADMIN']
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: demo
            http_basic: ~
    access_control:
        - {path: ^/admin, roles: ROLE_ADMIN}
