# The three Sonata roots an application configures (PLAN/08 §2). Everything else keeps its
# default, so that this file also documents what an application actually has to write.

sonata_admin:
    title: 'adminata demo'
    options:
        # Both are off by default; the demo turns them on because M4 has to style the sticky
        # form bar and the lock-conflict error, and neither renders unless something asks for it.
        use_stickyforms: true
        lock_protection: true
        html5_validate: false
    theme:
        mode: system
    dashboard:
        # Raw `<i>` markup, the way recomaty-panel writes its icons (appendix C §2): the sidebar
        # and the dashboard both render this unescaped, so a rewrite that escapes it breaks a
        # real application.
        groups:
            catalogue:
                label: Catalogue
                icon: '<i class="fa-solid fa-box"></i>'
                items:
                    - Adminata\Tests\App\Admin\ProductAdmin
            taxonomy:
                label: Taxonomy
                icon: '<i class="fa-solid fa-tags"></i>'
                items:
                    - Adminata\Tests\App\Admin\CategoryAdmin
            settings:
                label: Settings
                icon: '<i class="fa-solid fa-gear"></i>'
                # A group rendered as a single top-level link rather than a collapsible section.
                on_top: true
                items:
                    - {label: 'Dashboard', route: sonata_admin_dashboard}
        blocks:
            - {type: sonata.admin.block.admin_list, position: left, class: 'md:col-span-6'}

sonata_block:
    blocks:
        sonata.admin.block.admin_list:
            contexts: [admin]

sonata_form:
    # The only option the root has. Named here because M4 rewrites both layouts and the demo
    # has to say which one it is asking for.
    form_type: standard
