services:
    _defaults:
        autowire: true
        autoconfigure: true

    IDCT\Adminata\Tests\App\:
        resource: ../*
        exclude: ../{Entity,config,AppKernel.php}

    IDCT\Adminata\Tests\App\Controller\:
        resource: ../Controller
        tags: [controller.service_arguments]

    IDCT\Adminata\Tests\App\Block\DemoBlockService:
        tags: [adminata.block]

    adminata.admin.manager.test:
        class: IDCT\Adminata\Tests\App\Model\ModelManager
        arguments:
            - '@IDCT\Adminata\Tests\App\Model\FooRepository'
        tags:
            - {name: adminata.admin.manager}

    adminata.admin.manager.bar:
        class: IDCT\Adminata\Tests\App\Model\ModelManager
        arguments:
            - '@IDCT\Adminata\Tests\App\Model\BarRepository'
        tags:
            - {name: adminata.admin.manager}

    adminata.admin.manager.baz:
        class: IDCT\Adminata\Tests\App\Model\ModelManager
        arguments:
            - '@IDCT\Adminata\Tests\App\Model\BazRepository'
        tags:
            - {name: adminata.admin.manager}

    adminata.admin.builder.test_form:
        class: IDCT\Adminata\Tests\App\Builder\FormContractor
        arguments:
            - '@form.factory'
            - '@form.registry'

    adminata.admin.builder.test_show:
        class: IDCT\Adminata\Tests\App\Builder\ShowBuilder

    adminata.admin.builder.test_list:
        class: IDCT\Adminata\Tests\App\Builder\ListBuilder

    adminata.admin.pager.test:
        class: IDCT\Adminata\Tests\App\Datagrid\Pager
        arguments:
            - '@IDCT\Adminata\Tests\App\Model\FooRepository'
            - '@IDCT\Adminata\Tests\App\Model\BazRepository'

    adminata.admin.builder.test_datagrid:
        class: IDCT\Adminata\Tests\App\Builder\DatagridBuilder
        arguments:
            - '@form.factory'
            - '@adminata.admin.pager.test'
            - '@adminata.admin.datagrid.proxy_query'

    adminata.admin.data_source.test:
        class: IDCT\Adminata\Tests\App\Exporter\DataSource

    adminata.admin.datagrid.proxy_query:
        class: IDCT\Adminata\Tests\App\Datagrid\ProxyQuery

    adminata.admin.field_description_factory.test:
        class: IDCT\Adminata\Tests\App\FieldDescription\FieldDescriptionFactory

    adminata_foo_admin:
        class: IDCT\Adminata\Tests\App\Admin\FooAdmin
        tags:
            - {name: adminata.admin, model_class: IDCT\Adminata\Tests\App\Model\Foo, controller: 'adminata.admin.controller.crud', manager_type: test, label: Foo}
        calls:
            - [addChild, ['@adminata_bar_admin', 'foo']]

    IDCT\Adminata\Tests\App\Admin\FooAdminWithCustomController:
        tags:
            - {name: adminata.admin, model_class: IDCT\Adminata\Tests\App\Model\Foo, controller: IDCT\Adminata\Tests\App\Controller\CustomCRUDController, manager_type: test, label: Foo}

    IDCT\Adminata\Tests\App\Admin\AdminAsParameterAdmin:
        tags:
            - {name: adminata.admin, model_class: IDCT\Adminata\Tests\App\Model\Foo, manager_type: test}

    IDCT\Adminata\Tests\App\Admin\EmptyAdmin:
        tags:
            - {name: adminata.admin, model_class: IDCT\Adminata\Tests\App\Model\Foo, manager_type: test, label: Empty}

    IDCT\Adminata\Tests\App\Admin\TranslatedAdmin:
        tags:
            - {name: adminata.admin, model_class: IDCT\Adminata\Tests\App\Model\Translated, manager_type: test, group: 'group_label', label: 'admin_label'}

    adminata_baz_admin:
        class: IDCT\Adminata\Tests\App\Admin\BazAdmin
        tags:
            - {name: adminata.admin, model_class: IDCT\Adminata\Tests\App\Model\Baz, manager_type: test, model_manager: adminata.admin.manager.baz, label: Baz}

    adminata_bar_admin:
        class: IDCT\Adminata\Tests\App\Admin\BarAdmin
        tags:
            - {name: adminata.admin, model_class: IDCT\Adminata\Tests\App\Model\Bar, manager_type: test, model_manager: adminata.admin.manager.bar, label: Bar}
        calls:
            - [addChild, ['@adminata_baz_admin']]

    IDCT\Adminata\Tests\App\Admin\Extension\CustomAdminExtension:
        tags:
            - {name: adminata.admin.extension, target: adminata_foo_admin}
