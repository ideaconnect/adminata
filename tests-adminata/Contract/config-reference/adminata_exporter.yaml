adminata_exporter:
    exporter:
        default_writers:

            # Defaults:
            - csv
            - json
            - xls
            - xml
            - xlsx
    writers:
        csv:

            # path to the output file
            filename:             'php://output'

            # delimits csv values
            delimiter:            ','

            # will be used when a value contains the delimiter
            enclosure:            '"'

            # will be used when a value contains the enclosure
            escape:               \

            # add column names as the first line
            show_headers:         true

            # include the byte order mark
            with_bom:             false
        json:

            # path to the output file
            filename:             'php://output'
        xls:

            # path to the output file
            filename:             'php://output'

            # add column names as the first line
            show_headers:         true
        xlsx:

            # path to the output file
            filename:             'php://output'

            # add column names as the first line
            show_headers:         true

            # add filters in the first line
            show_filters:         true
        xml:

            # path to the output file
            filename:             'php://output'

            # add column names as the first line
            show_headers:         true

            # name of the wrapping element
            main_element:         datas

            # name of elements corresponding to rows
            child_element:        data
