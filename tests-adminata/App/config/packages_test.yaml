# Only in the `test` environment, which means only in-process under BrowserKit.
#
# `WebTestCase::createClient()` refuses to build a client without `framework.test`, and the mock
# session storage keeps the suite off real session files. Neither belongs on a server a browser
# talks to: the mock storage keys the session by name in a temp file rather than by a cookie, so
# every request after the first arrives already authenticated whoever sends it. The browser suites
# run in the `browser` environment for exactly that reason (Adminata\Tests\Support\DemoServer).

framework:
    test: true
    session:
        storage_factory_id: session.storage.factory.mock_file
    profiler:
        collect: false

dama_doctrine_test:
    # dama/doctrine-test-bundle keys its static connection by the *connection name*, and the
    # per-package test applications also call theirs `default`. Without a key of its own the demo
    # would be handed whichever database the suite that ran first had opened
    # (`adminata_orm_test`), and every one of its queries would look for a table that is not there.
    connection_keys:
        default: adminata_demo
