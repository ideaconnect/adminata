framework:
    assets:
        enabled: true
    form:
        enabled: true
    secret: secret
    http_method_override: false
    test: true
    translator:
        enabled: true
    session:
        storage_factory_id: session.storage.factory.mock_file
    router:
        utf8: true

security:
    firewalls:
        main:
            lazy: true

twig:
    strict_variables: true

parameters:
    # adminata supports MySQL, MariaDB and Percona; there is no SQLite support, so the
    # test application runs on the MySQL service of the repository's docker-compose.yml.
    env(DATABASE_URL): 'mysql://root:adminata@127.0.0.1:7010/adminata_orm_test?serverVersion=8.4.0&charset=utf8mb4'

doctrine:
    dbal:
        url: "%env(resolve:DATABASE_URL)%"
    orm:
        auto_mapping: true
        validate_xml_mapping: true
        mappings:
            SonataORMTest:
                type: attribute
                dir: "%kernel.project_dir%/Entity"
                is_bundle: false
                prefix: Sonata\DoctrineORMAdminBundle\Tests\App\Entity

sonata_admin:
    options:
        html5_validate: false
        use_stickyforms: false
