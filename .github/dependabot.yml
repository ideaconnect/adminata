version: 2

updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      groups:
          symfony:
              patterns:
                  - 'symfony/*'
          doctrine:
              patterns:
                  - 'doctrine/*'
          dev:
              dependency-type: development
      ignore:
          # adminata replaces these; they are never installed.
          - dependency-name: sonata-project/*

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      groups:
          tailwind:
              patterns:
                  - 'tailwindcss'
                  - '@tailwindcss/*'
          vite:
              patterns:
                  - 'vite'
                  - 'vitest'
          dev:
              dependency-type: development

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
