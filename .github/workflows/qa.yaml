name: Quality assurance

on:
    schedule:
        - cron: '30 0 * * *'
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    phpstan:
        name: PHPStan (Symfony ${{ matrix.symfony-require || 'highest' }})

        runs-on: ubuntu-latest

        env:
            SYMFONY_REQUIRE: ${{ matrix.symfony-require }}

        # Static analysis has to hold on both supported Symfony lines: their type signatures
        # differ, so analysing only the highest leaves the other unchecked.
        strategy:
            fail-fast: false
            matrix:
                symfony-require:
                    - ''
                    - '7.4.*'

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer:v2, flex
                  extensions: mongodb, pdo_mysql

            - name: Install Composer dependencies (highest)
              uses: ramsey/composer-install@v4
              with:
                  dependency-versions: highest

            - name: PHPStan
              run: vendor/bin/phpstan --no-progress --memory-limit=1G analyse --error-format=github

    rector:
        name: Rector (Symfony ${{ matrix.symfony-require || 'highest' }})

        runs-on: ubuntu-latest

        env:
            SYMFONY_REQUIRE: ${{ matrix.symfony-require }}

        strategy:
            fail-fast: false
            matrix:
                symfony-require:
                    - ''
                    - '7.4.*'

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer:v2, flex
                  extensions: mongodb, pdo_mysql

            - name: Install Composer dependencies (highest)
              uses: ramsey/composer-install@v4
              with:
                  dependency-versions: highest

            - name: Rector
              run: vendor/bin/rector process --dry-run --no-progress-bar
