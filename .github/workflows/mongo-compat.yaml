name: MongoDB fork

on:
    schedule:
        - cron: '30 1 * * *'
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

env:
    # idct/sonata-admin-mongodb-bundle is the reason adminata keeps Sonata's PHP API frozen
    # (owner directive 7, PLAN/02 §1). It is installed against this checkout as a path
    # repository, which is what an application does when it tries a fork.
    FORK_REPOSITORY: ideaconnect/sonata-admin-mongodb-bundle
    FORK_REF: 5.x

jobs:
    unit:
        name: Its unit suite against this checkout

        runs-on: ubuntu-latest

        # Its "unit" suite is not offline: 31 of its 342 tests exercise ObjectAclManipulator
        # against a real server through the ODM.
        services:
            mongo:
                image: mongo:8
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20

        steps:
            - name: Checkout adminata
              uses: actions/checkout@v7
              with:
                  path: adminata

            - name: Checkout the MongoDB fork
              uses: actions/checkout@v7
              with:
                  repository: ${{ env.FORK_REPOSITORY }}
                  ref: ${{ env.FORK_REF }}
                  path: fork

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer:v2
                  extensions: mongodb

            - name: Point the fork at this checkout
              working-directory: fork
              run: |
                  composer config repositories.adminata path ../adminata
                  # adminata ships the block, exporter, form and twig stacks itself (all four
                  # trees were merged into the admin bundle) and therefore conflicts with the
                  # four sonata-project packages. The fork is the root package here, so its own
                  # require and require-dev are installed and those conflicts would make the
                  # install unsolvable. Drop the entries in the checkout; the fork drops them for
                  # real when it moves to adminata. That settles the install alone; its test kernel
                  # still registers the bundles, which the next step deals with. `|| true` keeps
                  # these lines quiet the day the fork's manifest drops them. twig-extensions is
                  # not listed: the fork never required it directly, it arrived through the others.
                  composer remove --dev sonata-project/block-bundle --no-update --no-interaction || true
                  composer remove sonata-project/exporter --no-update --no-interaction || true
                  composer remove sonata-project/form-extensions --no-update --no-interaction || true
                  composer require idct/adminata:@dev --no-plugins --no-scripts --no-interaction --no-progress

            # Temporary shim, the other half of the `composer remove` above. The fork's test kernel
            # still registers Sonata\BlockBundle\SonataBlockBundle,
            # Sonata\Form\Bridge\Symfony\SonataFormBundle and Sonata\Twig\Bridge\Symfony\SonataTwigBundle,
            # and none of those three classes exists: block-bundle, form-extensions and
            # twig-extensions were merged into the admin bundle, and SonataAdminBundle::build()
            # registers the "sonata_block", "sonata_form" and "sonata_twig" extensions itself now.
            # The fork's phpunit bootstrap boots that kernel (tests/bootstrap.php ->
            # tests/custom_bootstrap.php) before the first test, so a leftover registration does not
            # fail a test, it ends the run:
            #     Error in bootstrap script: Class "Sonata\BlockBundle\SonataBlockBundle" not found
            # Installing the real packages instead would not help: their bundles and ours would each
            # register an extension aliased "sonata_block", "sonata_form" or "sonata_twig", and
            # Symfony refuses two of one alias.
            # The fix belongs in the fork, as one commit on its 5.x: drop the three imports and the
            # three `new …Bundle(),` entries from tests/App/AppKernel.php::registerBundles(). That
            # same commit has to repoint the fork's own `Sonata\Form\Type\…` imports (BooleanType,
            # DateRangeType, DateTimeRangeType, CollectionType) at `Sonata\AdminBundle\Form\Type\…`,
            # and src/Exporter/DataSource.php's `Sonata\Exporter\Source\DoctrineODMQuerySourceIterator`
            # at `Sonata\AdminBundle\Exporter\Source\…`; this step cannot do that, so until it lands
            # the unit suite below reports it.
            # This step fails when it cannot find every one of those lines, so it cannot rot into a
            # silent no-op once the commit lands: delete it then, together with the `composer
            # remove` lines above.
            - name: Stop the fork's test kernel registering the merged bundles
              working-directory: fork
              run: |
                  set -euo pipefail

                  kernel=tests/App/AppKernel.php
                  lines=(
                      'use Sonata\BlockBundle\SonataBlockBundle;'
                      '            new SonataBlockBundle(),'
                      'use Sonata\Form\Bridge\Symfony\SonataFormBundle;'
                      '            new SonataFormBundle(),'
                      'use Sonata\Twig\Bridge\Symfony\SonataTwigBundle;'
                      '            new SonataTwigBundle(),'
                  )

                  filter=()

                  for line in "${lines[@]}"; do
                      if ! grep -qxF -- "$line" "$kernel"; then
                          echo "::error file=$kernel::this checkout has no line [$line]. If the" \
                               "fork has stopped registering the merged bundles, delete this step" \
                               "and the composer remove lines above it."
                          exit 1
                      fi

                      filter+=(-e "$line")
                  done

                  grep -vxF "${filter[@]}" -- "$kernel" > "$kernel.shimmed"
                  mv "$kernel.shimmed" "$kernel"

                  # `use Sonata\BlockBundle\Cache\HttpCacheHandler;` is left alone on purpose:
                  # configureContainer() guards a config file with class_exists() on it, and that
                  # guard has been false since block-bundle 5.0 dropped the class. An import PHP
                  # never resolves costs nothing, while deleting only the import would repoint the
                  # guard at the test namespace. It is spelled Sonata\BlockBundle\…, so the check
                  # below — which looks for the bundle class names — does not see it.
                  if grep -n 'SonataBlockBundle\|SonataFormBundle\|SonataTwigBundle' "$kernel"; then
                      echo "::error file=$kernel::the shim left a merged-bundle reference."
                      exit 1
                  fi

                  php -l "$kernel"

            # The other half of the same shim. The fork's own sources still import the merged
            # namespaces — src/Exporter/DataSource.php names Sonata\Exporter\Source\… and the four
            # src/Filter/*.php name Sonata\Form\Type\… — and those classes live under
            # Sonata\AdminBundle\ now. Without this the unit suite below dies on the first filter or
            # DataSource test, which would make this job a known-red gate rather than a check.
            # Repointing them here keeps the gate meaningful: it still catches a genuine API break in
            # adminata, because everything except the namespace is the fork's real code.
            # Same commit, same deletion: when the fork repoints these itself the greps find nothing
            # and this step fails loudly rather than passing over an empty edit.
            - name: Repoint the fork's imports at the merged namespaces
              working-directory: fork
              run: |
                  set -euo pipefail

                  before=$(grep -rlE 'Sonata\\(Exporter|Form)\\' src tests | sort)

                  if [ -z "$before" ]; then
                      echo "::error::no file under src/ or tests/ imports Sonata\\Exporter\\ or" \
                           "Sonata\\Form\\ any more. If the fork has repointed them itself, delete" \
                           "this step and the shim above it."
                      exit 1
                  fi

                  echo "repointing:"; echo "$before" | sed 's/^/  /'

                  # shellcheck disable=SC2086
                  sed -i -e 's#Sonata\\Exporter\\#Sonata\\AdminBundle\\Exporter\\#g' \
                         -e 's#Sonata\\Form\\Type\\#Sonata\\AdminBundle\\Form\\Type\\#g' $before

                  if grep -rnE 'Sonata\\(Exporter|Form)\\' src tests; then
                      echo "::error::the shim left an unmerged namespace behind."
                      exit 1
                  fi

                  echo "$before" | xargs -r -n1 php -l > /dev/null

            # Not --strict: a path install pins `@dev`, and an unbound constraint is exactly what
            # composer's strict mode objects to. The fork's own CI validates its manifest.
            - name: Validate the fork's manifest
              working-directory: fork
              run: composer validate --no-check-lock

            - name: Prove the replaced packages came from adminata
              working-directory: fork
              run: |
                  test -f vendor/idct/adminata/composer.json
                  ! test -d vendor/sonata-project/admin-bundle

            - name: Its unit suite
              working-directory: fork
              run: vendor/bin/phpunit --testsuite unit

    functional:
        name: Its browser suite (informational)

        # Informational until M4: the fork's scenarios click through association modals that
        # adminata has not rewritten yet, and `ajaxSubmit` is gone for good (owner directive 5),
        # so some of them cannot pass in their current form. Failures here are a report, not a gate.
        continue-on-error: true

        runs-on: ubuntu-latest

        if: github.event_name == 'schedule'

        services:
            mongo:
                image: mongo:8
                ports:
                    - 27017:27017
                options: >-
