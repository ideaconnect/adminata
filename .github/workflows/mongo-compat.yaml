name: MongoDB fork

on:
    schedule:
        - cron: '30 1 * * *'
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

env:
    # idct/adminata-admin-mongodb-bundle is the MongoDB storage layer built on adminata (owner
    # directive 7). It is installed against this checkout as a path repository, which is what an
    # application does when it tries a fork.
    #
    # 7.x is the line built on adminata's IDCT\Adminata names; 6.x was built on the Sonata-named
    # adminata and 5.x on sonata-project/admin-bundle itself, and neither resolves against this
    # checkout any more.
    FORK_REPOSITORY: ideaconnect/adminata-admin-mongodb-bundle
    FORK_REF: 7.x

jobs:
    unit:
        # idct/adminata-doctrine-orm-admin-bundle is a dev dependency installed from a VCS repository
        # when no checkout sits beside this one, which is the case here; Composer resolves it through
        # the GitHub API, and unauthenticated calls share a per-runner hourly budget. The built-in
        # token lifts the limit and needs no secret.
        env:
            COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        name: Its unit suite against this checkout

        runs-on: ubuntu-latest

        # Its "unit" suite is not offline: 31 of its 342 tests exercise ObjectAclManipulator
        # against a real server through the ODM.
        services:
            mongo:
                image: mongo:8
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20

        steps:
            - name: Checkout adminata
              uses: actions/checkout@v6
              with:
                  path: adminata

            - name: Checkout the MongoDB fork
              uses: actions/checkout@v6
              with:
                  repository: ${{ env.FORK_REPOSITORY }}
                  ref: ${{ env.FORK_REF }}
                  path: fork

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer:v2
                  extensions: mongodb

            # The fork's own composer.json already carries a path repository at ../adminata for a
            # checkout sitting beside it, which is exactly this layout, and a vcs one behind it.
            # Overriding the path here makes the job independent of that ordering.
            - name: Point the fork at this checkout
              working-directory: fork
              run: |
                  composer config repositories.adminata path ../adminata
                  composer require idct/adminata:@dev --no-plugins --no-scripts --no-interaction --no-progress

            # Not --strict: a path install pins `@dev`, and an unbound constraint is exactly what
            # composer's strict mode objects to. The fork's own CI validates its manifest.
            - name: Validate the fork's manifest
              working-directory: fork
              run: composer validate --no-check-lock

            - name: Prove that no sonata-project package came along
              working-directory: fork
              run: |
                  test -f vendor/idct/adminata/composer.json
                  ! test -d vendor/sonata-project/admin-bundle

            - name: Its unit suite
              working-directory: fork
              run: vendor/bin/phpunit --testsuite unit

    functional:
        # idct/adminata-doctrine-orm-admin-bundle is a dev dependency installed from a VCS repository
        # when no checkout sits beside this one, which is the case here; Composer resolves it through
        # the GitHub API, and unauthenticated calls share a per-runner hourly budget. The built-in
        # token lifts the limit and needs no secret.
        env:
            COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        name: Its browser suite

        # A real gate since the fork's 6.0. It used to be informational because its scenarios
        # clicked through association modals adminata has not rewritten; the fork marks those
        # `legacy-ui` and excludes them itself now, so what is left here is expected to pass. This
        # job runs nightly, not on pull requests, so a browser flake reports rather than blocks.
        runs-on: ubuntu-latest

        if: github.event_name == 'schedule'

        services:
            mongo:
                image: mongo:8
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20

        steps:
            - name: Checkout adminata
              uses: actions/checkout@v6
              with:
                  path: adminata

            - name: Checkout the MongoDB fork
              uses: actions/checkout@v6
              with:
                  repository: ${{ env.FORK_REPOSITORY }}
                  ref: ${{ env.FORK_REF }}
                  path: fork

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer:v2
                  extensions: mongodb

            # The fork's own composer.json already carries a path repository at ../adminata for a
            # checkout sitting beside it, which is exactly this layout, and a vcs one behind it.
            # Overriding the path here makes the job independent of that ordering.
            - name: Point the fork at this checkout
              working-directory: fork
              run: |
                  composer config repositories.adminata path ../adminata
                  composer require idct/adminata:@dev --no-plugins --no-scripts --no-interaction --no-progress

            # The runner's own Firefox and geckodriver, not a Selenium service: a service container
            # cannot reach the runner's loopback, where Panther starts its web server.
            - name: Its browser suite
              working-directory: fork
              run: vendor/bin/phpunit --testsuite functional
