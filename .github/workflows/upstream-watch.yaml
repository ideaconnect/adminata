name: Upstream watch

on:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

permissions:
    contents: read
    issues: write

jobs:
    upstream-watch:
        name: Newer releases of the forked packages

        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Compare each package with its upstream latest release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  grep -v '^#' upstream/remotes.txt | while read -r name url tag; do
                      [ -z "$name" ] && continue
                      repo=$(echo "$url" | sed -E 's#https://github.com/([^/]+/[^/]+)\.git#\1#')
                      latest=$(gh api "repos/$repo/releases/latest" --jq .tag_name 2>/dev/null || echo '')

                      if [ -z "$latest" ] || [ "$latest" = "$tag" ]; then
                          echo "$name: up to date at $tag"
                          continue
                      fi

                      # A tree in upstream/merged.txt has no packages/<name>/ of its own, so
                      # `make upstream-sync` refuses it and the issue has to ask for a hand port.
                      merged_into=$(grep -v '^#' upstream/merged.txt | awk -v p="$name" '$1 == p { print $2 }')

                      echo "$name: $tag -> $latest"
                      {
                          if [ -n "$merged_into" ]; then
                              echo "\`$name\` was merged into \`packages/$merged_into\` and has no directory of"
                              echo "its own. Its sources sit at \`$tag\`; upstream released \`$latest\`."
                          else
                              echo "\`packages/$name\` is at \`$tag\`; upstream released \`$latest\`."
                          fi
                          echo
                          echo 'Report:'
                          echo
                          echo '```'
                          upstream/diff.sh "$name" "$tag" "$latest" 2>&1 || true
                          echo '```'
                          echo
                          if [ -n "$merged_into" ]; then
                              echo "\`make upstream-sync PKG=$name\` refuses a merged tree. Port the changes by hand"
                              echo "into \`packages/$merged_into\`, then bump the row in \`upstream/remotes.txt\` and in"
                              echo "UPSTREAM.md — there is no \`replace\` entry to bump (see upstream/merged.txt)."
                          else
                              echo "Apply with \`make upstream-sync PKG=$name TO=$latest\` (see UPSTREAM.md)."
                          fi
                      } > body.md

                      title="Sync $name to $latest"

                      if [ -z "$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')" ]; then
                          gh issue create --title "$title" --body-file body.md --label upstream \
                              || gh issue create --title "$title" --body-file body.md
                      fi
                  done
