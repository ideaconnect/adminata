name: Symfony lint

on:
    schedule:
        - cron: '30 0 * * *'
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

env:
    # A pull request checks out its own branch, and Composer names the root package after it
    # (`dev-feature/…`). The ORM layer, a dev dependency, requires `idct/adminata dev-main`, which
    # only `main` satisfies — so on any other branch the dependency install failed before a
    # single check ran, and every pull request went red for that alone. Naming the root `dev-main`
    # resolves a branch the way `main` resolves.
    COMPOSER_ROOT_VERSION: dev-main

jobs:
    symfony-lint:
        # idct/adminata-doctrine-orm-admin-bundle is a dev dependency installed from Packagist when
        # no checkout sits beside this one, which is the case here; its archive is fetched through
        # the GitHub API, and unauthenticated calls share a per-runner hourly budget. The built-in
        # token lifts the limit and needs no secret.
        env:
            COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        name: Container, Twig, XLIFF and YAML

        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer:v2
                  extensions: mongodb, pdo_mysql

            - name: Install Composer dependencies (highest)
              uses: ramsey/composer-install@v4
              with:
                  dependency-versions: highest

            - name: Lint the container
              run: make lint-container

            - name: Lint Twig templates
              run: make lint-twig

            - name: Lint XLIFF catalogues
              run: make lint-symfony-xliff

            - name: Lint YAML files
              run: make lint-symfony-yaml
