name: Visual

on:
    schedule:
        - cron: '30 0 * * *'
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    visual:
        # idct/adminata-doctrine-orm-admin-bundle is a dev dependency installed from a VCS repository
        # when no checkout sits beside this one, which is the case here; Composer resolves it through
        # the GitHub API, and unauthenticated calls share a per-runner hourly budget. The built-in
        # token lifts the limit and needs no secret.
        env:
            COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        name: Screenshots, axe and html-validate

        runs-on: ubuntu-latest

        # adminata supports MySQL, MariaDB and Percona; there is no SQLite support. The port
        # matches docker-compose.yml so the demo's defaults work unchanged.
        services:
            database:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: adminata
                    MYSQL_DATABASE: adminata_test
                ports:
                    - 7010:3306
                options: >-
                    --health-cmd "mysqladmin ping -h 127.0.0.1 -padminata"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer:v2
                  extensions: pdo_mysql

            - name: Install Composer dependencies
              uses: ramsey/composer-install@v4

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install exactly what the lock file pins
              run: npm ci

            # bin/visual.sh serves the demo with the host's PHP and drives it from
            # mcr.microsoft.com/playwright, the image that produced the committed baselines under
            # tests-adminata/Visual/__snapshots__. Those are pixels: run them anywhere else and the fonts
            # alone make every one of them differ, so this job and `make test-visual` have to be
            # the same command. Changing the image means regenerating every baseline.
            - name: Screenshots, accessibility and markup
              run: make test-visual

            - name: Upload the report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v5
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      tests-adminata/Visual/test-results/
                  retention-days: 7
                  if-no-files-found: ignore
