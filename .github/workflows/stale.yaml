name: Stale

on:
    schedule:
        - cron: '0 3 * * *'

permissions:
    contents: read
    issues: write
    pull-requests: write

jobs:
    stale:
        name: Close stale issues and pull requests

        runs-on: ubuntu-latest

        steps:
            - uses: actions/stale@v10
              with:
                  days-before-stale: 60
                  days-before-close: 14
                  exempt-issue-labels: 'pinned,security,roadmap'
                  exempt-pr-labels: 'pinned,security'
                  stale-issue-message: >
                      This issue has had no activity for 60 days. It will be closed in 14 days
                      unless something happens. Comment if it is still relevant.
                  stale-pr-message: >
                      This pull request has had no activity for 60 days. It will be closed in 14
                      days unless something happens.
